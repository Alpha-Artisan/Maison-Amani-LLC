<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maison Amani — Extra-Terra 001</title>
<meta name="description" content="Extra-Terra 001. Maison Amani.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Archivo:wght@300;400&display=swap">
<style>
:root{
  --night:#08080A; --deep:#050506;
  --paper:#E8E5DF;
  --mineral:#E9E4DA; --silver:#B4AFA6; --muted:#6B675F;
  --display:'Prata',Georgia,serif;
  --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --gutter:clamp(22px,5vw,110px);
  --rule:rgba(233,228,218,.12);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--night);color:var(--silver);
  font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
::selection{background:#26231E;color:var(--mineral)}

.meta{font-size:10px;letter-spacing:.36em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:400}
.d{font-family:var(--display);font-weight:400;letter-spacing:-.015em;line-height:1.03;margin:0;color:var(--mineral)}
.d-xl{font-size:clamp(42px,8vw,132px)}
.d-l{font-size:clamp(30px,5vw,76px)}

/* masthead */
.mast{position:fixed;inset:0 0 auto 0;z-index:40;display:flex;justify-content:space-between;align-items:center;
  padding:clamp(16px,2.4vh,26px) var(--gutter);pointer-events:none}
.mast .lock{position:relative;display:block;width:clamp(96px,8.6vw,128px);aspect-ratio:440/251;line-height:0}
.mast .lock img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .8s ease}
.mast .lock .ink{opacity:0}
.mast.on-light .lock .bone{opacity:0}
.mast.on-light .lock .ink{opacity:1}
.mast .ref{font-size:10px;letter-spacing:.36em;text-transform:uppercase;color:#8A847B;transition:color .8s ease}
.mast.on-light .ref{color:#6C665C}
@media(max-width:620px){.mast .ref{display:none}}

/* 01 arrival */
.arrival{position:relative;height:520vh;background:#000}
@media(max-width:820px){.arrival{height:430vh}}
.pin{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;place-items:center}
/* the sequence itself, full bleed — it carries its own light and its own ground */
#hero{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;
  opacity:0;transition:opacity 1.1s cubic-bezier(.4,0,.2,1)}
#hero.lit{opacity:1}
/* the star field rides over the dark frames and washes out as the light comes up */
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2;
  mix-blend-mode:screen;pointer-events:none;opacity:var(--so,1)}
.halo{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) scale(var(--hs,1));z-index:0;
  width:min(128vw,116svh,1320px);aspect-ratio:1;mix-blend-mode:screen;opacity:var(--ho,0);pointer-events:none;
  background:radial-gradient(circle at 50% 50%,
    rgba(255,248,232,.98) 0%, rgba(255,232,190,.76) 8%, rgba(255,206,142,.48) 18%,
    rgba(232,148,68,.24) 32%, rgba(146,98,54,.10) 48%, transparent 68%);
  filter:blur(26px)}
.halo::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44%;aspect-ratio:1;border-radius:50%;filter:blur(40px);
  background:radial-gradient(circle,rgba(255,252,244,.95) 0%,rgba(255,226,176,.55) 46%,transparent 72%)}
.nova{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) scale(var(--ns,.3));z-index:2;
  width:min(150vw,150svh,1500px);aspect-ratio:1;pointer-events:none;mix-blend-mode:screen;opacity:var(--no,0);
  background:
    radial-gradient(circle at 50% 50%, rgba(255,250,236,.92) 0%, rgba(255,232,190,.48) 6%, rgba(255,198,126,.16) 15%, transparent 38%),
    conic-gradient(from 0deg, rgba(255,240,214,.09) 0deg, transparent 10deg, rgba(255,240,214,.06) 26deg, transparent 38deg,
      rgba(255,240,214,.09) 62deg, transparent 76deg, rgba(255,240,214,.05) 100deg, transparent 118deg,
      rgba(255,240,214,.08) 154deg, transparent 168deg, rgba(255,240,214,.06) 210deg, transparent 226deg,
      rgba(255,240,214,.07) 266deg, transparent 282deg, rgba(255,240,214,.06) 322deg, transparent 338deg);
  filter:blur(26px)}
.pin figure{margin:0;z-index:1;width:min(86vw,74svh,860px);aspect-ratio:1/1;position:relative}
.pin img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.arrival .id{position:absolute;z-index:3;left:var(--gutter);bottom:clamp(26px,6vh,56px);opacity:0;transition:opacity 1.4s ease}
.arrival .id.on{opacity:1}

/* a held breath between chapters */
.hold{height:52vh}
.hold--s{height:22vh}

/* 02 the object — a single plate, centred, nothing else */
.object{padding:clamp(80px,14vh,190px) var(--gutter) clamp(60px,10vh,140px);display:grid;justify-items:center;gap:clamp(30px,6vh,72px)}
.object figure{margin:0;width:min(74vw,62svh,620px)}
.object img{width:100%;height:auto}
.object .line{text-align:center}

/* the one sentence that is not a riddle */
.label{margin:0;text-align:center;color:#7B766D;font-size:clamp(13px,1.2vw,15px);
  letter-spacing:.04em;font-weight:300}
.object .label{margin-top:clamp(-14px,-1.4vh,-8px)}

/* 03 the surface — full bleed band */
.surface{margin:0;position:relative}
.surface img{width:100%;height:min(74svh,760px);object-fit:cover;object-position:center 42%}
.surface .meta{position:absolute;left:var(--gutter);bottom:clamp(20px,4vh,40px)}

/* 04 the dome */
.dome{padding:clamp(90px,16vh,220px) var(--gutter);display:grid;justify-items:center;gap:clamp(26px,5vh,56px);background:var(--night)}
.dome figure{margin:0;width:min(82vw,60svh,720px)}
.dome img{width:100%;height:auto}

/* 05 the vessel */
.vessel{padding:clamp(110px,22vh,280px) var(--gutter) clamp(90px,16vh,200px)}
.vessel .l1{display:block}
.vessel .l2{display:block;margin-left:clamp(0px,20vw,340px);color:#6E6A62}

/* adrift — the core, weightless, unnamed.

   left/top are the object's CENTRE, not its corner: the plates are square and
   the specimen is centred in them, so placing by corner would put each one
   somewhere slightly different from where it looks placed. The JS carries the
   -50%,-50% that makes that true.

   The arrangement:
   · Frankincense is the heaviest thing here — biggest, brightest, nearest — so
     it takes the lower-left third intersection and everything else answers it.
   · Labdanum is the lightest and sits farthest away, up and right, holding the
     opposite corner without matching its weight. The balance is asymmetric on
     purpose: even weight either side of centre reads as a layout, not a field.
   · No two share an x or a y, and no gap repeats — so nothing pairs off and
     nothing lines up.
   · The four make a triangle with one outside it, which the eye reads as
     arranged. Four points evenly scattered read as spilled.
   · Size, opacity, shadow weight and focus all come off one depth value, so
     front-to-back is never ambiguous. */
.drift{position:relative;height:100svh;min-height:600px;overflow:hidden;background:var(--night)}
.drift .sp{position:absolute;margin:0;will-change:transform;pointer-events:none;
  transform:translate(-50%,-50%)}
.drift .sp img{display:block;width:100%;height:auto}
/* The name travels with the material, so the two never come apart. Each plate
   is square but each specimen fills it differently, so a single bottom offset
   left some names hanging far below their object. These are measured from each
   plate's own alpha: the gap is the same fraction of every plate, which reads
   as a constant distance because the bigger object gets the bigger gap. */
.drift figcaption{position:absolute;left:0;right:0;text-align:center;
  font-family:var(--sans);font-size:9px;letter-spacing:.34em;text-transform:uppercase;
  color:rgba(214,206,193,.34);white-space:nowrap}
#sp1 figcaption{bottom:26.6%}
#sp2 figcaption{bottom:24.4%}
#sp3 figcaption{bottom:27.9%}
#sp4 figcaption{bottom:25.7%}
@media(max-width:620px){.drift figcaption{font-size:8px;letter-spacing:.28em;bottom:5%}}
/* no drop-shadows: there is no floor here for a shadow to land on, and a black
   one over a near-black ground only prints a soft box around each specimen.
   Distance is carried by size, opacity and focus, which is enough. */
#sp1{left:19%; top:29%; width:clamp(186px,25vw,356px); opacity:.92}
#sp2{left:40%; top:66%; width:clamp(244px,33vw,478px); opacity:1}
#sp3{left:71%; top:21%; width:clamp(132px,18vw,262px); opacity:.76; filter:blur(.9px)}
#sp4{left:84%; top:57%; width:clamp(198px,27vw,384px); opacity:.94}
/* narrow: the same logic, stacked — the heavy one still off-centre, the far
   one still small and high, alternating sides so the eye zigzags down */
@media(max-width:620px){
  #sp1{left:29%; top:15%; width:52vw}
  #sp2{left:52%; top:38%; width:70vw}
  #sp3{left:24%; top:62%; width:38vw}
  #sp4{left:62%; top:83%; width:56vw}
}

/* the opening */
.opening{position:relative;height:330vh;background:var(--night)}
@media(max-width:820px){.opening{height:280vh}}
.opening .pin figure{margin:0;z-index:1;width:min(86vw,74svh,860px);aspect-ratio:1/1;position:relative}
.opening .pin img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
@media(prefers-reduced-motion:reduce){.opening{height:auto}.opening .pin{position:relative;height:auto;padding:14vh 0}}

/* 06 two states — one object, one line, two skies */
.states{position:relative;height:100svh;min-height:620px;overflow:hidden;user-select:none;touch-action:pan-y;background:#05070C}
.states .layer{position:absolute;inset:0}
.states .sky-night,.states .sky-day{top:-190px;bottom:-190px;will-change:transform}
.states .flock,.states .stars{top:-170px;bottom:-170px;height:auto}
.states .weather{will-change:transform}
.states .day,.states .clip-day{clip-path:inset(0 0 0 var(--x,50%))}
.states .sky{z-index:0}
.states .weather{z-index:2}
.sky-night{position:absolute;left:0;right:0;background:
  radial-gradient(120% 96% at 81% 14%, #24304A 0%, #151F35 30%, #0A1020 62%, #05070E 100%)}
.sky-day{position:absolute;left:0;right:0;background:
  radial-gradient(120% 96% at 81% 14%, #E6F0F9 0%, #CEE1F2 32%, #B2CFE9 66%, #9FC2E0 100%)}

/* the seat: sun and moon occupy the same sky */
.orb{position:absolute;right:19%;top:14%;width:clamp(58px,6.6vw,96px);aspect-ratio:1;border-radius:50%}
.sun{background:radial-gradient(circle at 50% 50%, #FFFFFF 0%, #FFFCF2 24%, #FFF2D4 42%, rgba(255,235,186,.42) 62%, rgba(255,232,176,0) 78%);
  box-shadow:0 0 70px 22px rgba(255,248,226,.85), 0 0 200px 90px rgba(255,238,196,.40), 0 0 520px 260px rgba(255,240,204,.16)}
.moon{background:radial-gradient(circle at 38% 34%, #F7F3E9 0%, #E7E1D3 44%, #CBC5B6 74%, #ADA79A 100%);
  box-shadow:0 0 60px 14px rgba(232,228,214,.20), 0 0 200px 80px rgba(150,176,214,.14), inset -6px -8px 18px rgba(0,0,0,.28)}
.moon::after{content:'';position:absolute;inset:0;border-radius:50%;opacity:.42;
  background:radial-gradient(circle at 62% 58%, rgba(0,0,0,.16) 0 11%, transparent 12%),
             radial-gradient(circle at 34% 64%, rgba(0,0,0,.11) 0 8%, transparent 9%),
             radial-gradient(circle at 56% 30%, rgba(0,0,0,.09) 0 6%, transparent 7%),
             radial-gradient(circle at 44% 46%, rgba(0,0,0,.07) 0 5%, transparent 6%)}
.stars,.flock{position:absolute;inset:0}
.flock{z-index:3;pointer-events:none}   /* over the weather, under the object */

/* weather: everything drifts, nothing is still */
.cloud{position:absolute;left:0;top:0;border-radius:50%;will-change:transform,opacity;
  transform-origin:50% 50%}
.cloud::before,.cloud::after{content:'';position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:64%;height:164%;left:6%;top:-56%}
.cloud::after{width:46%;height:132%;right:5%;top:-30%}
.cloud.n{background:rgba(126,146,184,.13);filter:blur(30px)}
.cloud.d{background:rgba(255,255,255,.86);filter:blur(22px)}
@keyframes drift{from{transform:translate3d(-46vw,0,0)}to{transform:translate3d(146vw,0,0)}}
.states .obj{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(52vw,58svh,580px);z-index:3;pointer-events:none}
.states .obj img{width:100%;height:auto}
.states .shade{position:absolute;left:50%;bottom:-3%;transform:translateX(-50%);
  width:78%;height:9%;border-radius:50%;background:rgba(0,0,0,.42);filter:blur(22px);z-index:-1}
.states .cut{position:absolute;top:0;bottom:0;left:var(--x,50%);width:1px;background:#fff;z-index:5;
  mix-blend-mode:difference}
.states .grip{position:absolute;top:50%;left:var(--x,50%);transform:translate(-50%,-50%);z-index:6;
  width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.62);
  background:rgba(255,255,255,.12);cursor:ew-resize;display:grid;place-items:center;
  box-shadow:0 0 0 1px rgba(0,0,0,.18), 0 6px 26px rgba(0,0,0,.22)}
.states .grip::before{content:'';width:14px;height:1px;background:rgba(255,255,255,.85);box-shadow:0 -5px 0 rgba(255,255,255,.85),0 5px 0 rgba(255,255,255,.85)}
.states .tag{position:absolute;bottom:clamp(22px,5vh,48px);z-index:6;font-size:10px;letter-spacing:.36em;text-transform:uppercase}
.states .tag-n{left:var(--gutter);color:#9FA8BC}
.states .tag-d{right:var(--gutter);color:#4A5666}
@media(prefers-reduced-motion:reduce){.cloud,.bird,.bird .w{animation:none!important}}

.sub{color:var(--dim);margin-top:14px;letter-spacing:.24em}
.object .sub,.after .sub{text-align:center}
.say{max-width:46ch;margin:0;color:var(--dim);font-size:clamp(13px,1.15vw,15px);line-height:1.85;letter-spacing:.012em}

/* 07 first edition */
.first{position:relative;min-height:96svh;display:grid;align-items:center;background:var(--deep);padding:clamp(80px,14vh,160px) 0}
.first .inner{position:relative;z-index:2;padding:0 var(--gutter);max-width:32rem}
.join{margin-top:clamp(26px,5vh,52px)}
.join .row{display:flex;gap:14px;align-items:baseline;border-bottom:1px solid rgba(233,228,218,.2);padding-bottom:10px;max-width:24rem}
.join input{flex:1;background:none;border:0;outline:0;color:var(--mineral);font-family:var(--sans);font-weight:300;font-size:15px;padding:6px 0}
.join input::placeholder{color:#57534C}
/* an arrow, not an instruction: the gesture belongs to the world, not the form */
.join button{background:none;border:0;padding:2px 0 2px 6px;cursor:pointer;color:var(--silver);
  font-family:var(--sans);font-size:19px;line-height:1;letter-spacing:0;
  transition:color .5s ease,transform .5s cubic-bezier(.4,0,.2,1)}
.join button:hover{color:var(--mineral);transform:translateX(4px)}
.join button:focus-visible{outline:1px solid rgba(214,206,193,.5);outline-offset:6px}
@media(max-width:620px){.join button{padding:11px 10px 11px 16px}}  /* a thumb needs more than an arrow */
.join .note{margin-top:14px;min-height:1.2em}

/* 08 afterimage */
.after{min-height:92svh;display:grid;place-items:center;text-align:center;background:var(--night);padding:0 var(--gutter)}
/* the record: a catalogue card, not a spec sheet. values line up because an
   archive lines up; nothing is emphasised, including the word candle. */
.record{margin:clamp(40px,7vh,84px) auto 0;display:grid;grid-template-columns:auto auto;
  gap:9px clamp(18px,3vw,34px);width:max-content;text-align:left;
  font-family:var(--sans);font-size:9px;letter-spacing:.32em;text-transform:uppercase}
.record dt{color:rgba(214,206,193,.30);margin:0}
.record dd{color:rgba(214,206,193,.55);margin:0}
@media(max-width:620px){.record{font-size:8px;letter-spacing:.26em;gap:8px 22px}}
.after .wm{margin:clamp(48px,9vh,110px) auto 0;width:clamp(132px,13vw,186px);aspect-ratio:440/251}
.after .wm img{width:100%;height:100%;object-fit:contain;opacity:.86}
footer{padding:clamp(36px,7vh,80px) var(--gutter) clamp(46px,8vh,100px);display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;border-top:1px solid var(--rule)}

.rise{opacity:0;transform:translateY(14px);transition:opacity 1.6s cubic-bezier(.2,.7,.2,1),transform 1.6s cubic-bezier(.2,.7,.2,1)}
.rise.in{opacity:1;transform:none}
.fade{opacity:0;transition:opacity 2s ease}
.fade.in{opacity:1}
@media(prefers-reduced-motion:reduce){.rise,.fade{opacity:1;transform:none;transition:none}.arrival{height:auto}.pin{position:relative;height:auto;padding:14vh 0}}
@media(max-width:620px){
  .states .grip{top:74%}
  .orb{right:14%;top:11%;width:clamp(54px,16vw,80px)}
  .sun{box-shadow:0 0 46px 14px rgba(255,248,226,.80), 0 0 120px 50px rgba(255,238,196,.30), 0 0 300px 150px rgba(255,240,204,.12)}
}
</style>
</head>
<body>

<header class="mast" id="mast" aria-label="Maison Amani">
  <a class="lock" href="#arrival" aria-label="Maison Amani">
    <img class="bone" src="img/lockup-bone.png" width="440" height="251" alt="Maison Amani">
    <img class="ink"  src="img/lockup-ink.png"  width="440" height="251" alt="" aria-hidden="true">
  </a>
  <span class="ref">Art&nbsp;objects</span>
</header>

<main>

<!-- 01 -->
<section class="arrival" id="arrival" aria-label="Extra-Terra 001">
  <div class="pin">
    <canvas id="hero" aria-label="Extra-Terra 001" role="img"></canvas>
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="id" id="id">
      <p class="meta">Extra&#8209;Terra</p>
      <p class="d" style="font-size:clamp(26px,3vw,42px);margin-top:10px">001</p>
    </div>
  </div>
</section>

<div class="hold"></div>

<!-- 02 -->
<section class="object" aria-label="The object">
  <figure class="fade">
    <img src="img/a-object-black-b.webp" width="1652" height="1854" loading="lazy" decoding="async"
         alt="Extra-Terra 001, black">
  </figure>
  <p class="d d-l line rise">Not from here.</p>
  <p class="label rise">A vessel for light and scent.</p>
</section>

<div class="hold hold--s"></div>

<!-- 03 -->
<figure class="surface" aria-label="Surface">
  <img src="img/a-surface-b.webp" width="2600" height="1417" loading="lazy" decoding="async" alt="Surface, close">
  <figcaption class="meta">The surface</figcaption>
</figure>

<div class="hold hold--s"></div>

<!-- 04 -->
<section class="drift" id="drift" aria-label="The core">
  <figure class="sp" id="sp1"><img src="img/e-agarwood.webp"     width="900" height="900" loading="lazy" decoding="async" alt="Agarwood"><figcaption>Agarwood</figcaption></figure>
  <figure class="sp" id="sp2"><img src="img/e-frankincense.webp" width="900" height="900" loading="lazy" decoding="async" alt="Frankincense"><figcaption>Frankincense</figcaption></figure>
  <figure class="sp" id="sp3"><img src="img/e-labdanum.webp"     width="900" height="900" loading="lazy" decoding="async" alt="Labdanum"><figcaption>Labdanum</figcaption></figure>
  <figure class="sp" id="sp4"><img src="img/e-vetiver.webp"      width="900" height="900" loading="lazy" decoding="async" alt="Vetiver"><figcaption>Vetiver</figcaption></figure>
</section>

<div class="hold hold--s"></div>

<!-- 05 -->
<section class="dome" aria-label="From above">
  <p class="d d-l line rise" style="margin-bottom:clamp(26px,5vh,54px)">The rest is still sealed.</p>
  <figure class="fade">
    <img src="img/a-dome-top-b.webp" width="1907" height="1484" loading="lazy" decoding="async" alt="The dome, from above">
  </figure>
</section>

<!-- 06 -->
<section class="states" id="states" aria-label="Two skies">
  <div class="layer sky night" aria-hidden="true">
    <div class="sky-night"></div>
    <canvas class="stars" id="starfield"></canvas>
    <div class="orb moon"></div>
  </div>

  <div class="layer sky day" id="dayLayer" aria-hidden="true">
    <div class="sky-day"></div>
    <div class="orb sun"></div>
  </div>

  <canvas class="flock" id="flock" aria-hidden="true"></canvas>

  <div class="layer weather" aria-hidden="true">
    <div class="cloud n" data-d=".22" style="width:58vw;height:13vh;top:57%"></div>
    <div class="cloud n" data-d=".34" style="width:42vw;height:9vh;top:31%"></div>
    <div class="cloud n" data-d=".62" style="width:30vw;height:7vh;top:77%"></div>
    <div class="cloud n" data-d=".80" style="width:22vw;height:5vh;top:20%"></div>
  </div>

  <div class="layer weather clip-day" aria-hidden="true">
    <div class="cloud d" data-d=".20" style="width:52vw;height:12vh;top:53%"></div>
    <div class="cloud d" data-d=".38" style="width:36vw;height:8vh;top:29%"></div>
    <div class="cloud d" data-d=".64" style="width:27vw;height:6vh;top:74%"></div>
    <div class="cloud d" data-d=".84" style="width:19vw;height:4.5vh;top:19%"></div>
  </div>

  <div class="obj">
    <span class="shade" aria-hidden="true"></span>
    <img src="img/a-front-black-b.webp" width="1905" height="1803" loading="lazy" decoding="async" alt="Extra-Terra 001 at night">
    <img src="img/a-front-bone-b.webp" width="1905" height="1803" loading="lazy" decoding="async" alt="Extra-Terra 001 in daylight"
         id="objDay" style="position:absolute;inset:0;clip-path:inset(0 0 0 var(--ox,50%))">
  </div>

  <div class="cut" id="cut"></div>

<script>
(function(){
  "use strict";
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var clamp = function(v,a,b){ return Math.max(a, Math.min(b,v)); };
  var arrival = document.getElementById('arrival');

  /* ---- the arrival: it comes up out of the dark ----
     81 rendered frames, scrubbed by scroll. Frame 68 was once a straggler from
     an older state of the scene and had to be stepped over, and has since been
     re-rendered — it now steps with its neighbours. Frame 80 (render 0081) is
     the settled object, and closes the sequence. */
  var pad = function(i){ return String(i).padStart(2,'0'); };
  var SET = innerWidth > 760 ? 'v' : 'vm';
  var N = 81;
  var FRAMES = Array.from({length:N}, function(_,n){ return SET + '/' + pad(n) + '.webp'; });

  var cache = [], shot2 = document.getElementById('shot2');
  function warm(i){
    if(cache[i]) return cache[i];
    var im = new Image(); im.decoding = 'async'; im.src = FRAMES[i]; cache[i] = im; return im;
  }
  for(var i=0;i<8;i++) warm(i);
  (window.requestIdleCallback || function(cb){ setTimeout(cb,300); })(function(){ for(var i=8;i<N;i++) warm(i); });
  if(shot2) shot2.src = (innerWidth > 760 ? 'o' : 'om') + '/58.webp';

  /* ---- the frame, painted full bleed, carrying its own ground ----
     The render is square and the window is not, so the strip left over on each side
     is filled by extending that frame's own outermost pixels and letting them fall
     away. The seam is exact by construction: the first stretched column IS the
     frame's edge column, so the join cannot show, and the falloff keeps the spill
     from reading as a flat painted band once the halo comes up. */
  var hero = document.getElementById('hero'), hx = hero.getContext('2d', {alpha:false});
  var HW = 0, HH = 0, HD = 1, ZOOM = 1.0, BLEED = 6, curFrame = -1;

  function fitHero(){
    HD = Math.min(devicePixelRatio || 1, 2);
    HW = hero.clientWidth; HH = hero.clientHeight;
    hero.width = Math.round(HW*HD); hero.height = Math.round(HH*HD);
    hx.setTransform(HD,0,0,HD,0,0);
    curFrame = -1;
  }

  function paint(im){
    if(!im || !im.naturalWidth) return;
    var iw = im.naturalWidth, ih = im.naturalHeight;
    var s  = Math.min(HW/iw, HH/ih) * ZOOM;
    var dw = iw*s, dh = ih*s;
    var dx = (HW-dw)/2, dy = (HH-dh)/2;

    hx.fillStyle = '#000'; hx.fillRect(0,0,HW,HH);
    hx.drawImage(im, 0,0,iw,ih, dx,dy,dw,dh);

    if(dx > 0.5){                         /* window wider than the frame */
      hx.drawImage(im, 0,0,BLEED,ih,        0,     dy, dx+1, dh);
      hx.drawImage(im, iw-BLEED,0,BLEED,ih, dx+dw-1, dy, dx+1, dh);
      shade(0, dy, dx, dh, 'h');
    }
    if(dy > 0.5){                         /* window taller than the frame */
      hx.drawImage(im, 0,0,iw,BLEED,        dx, 0,      dw, dy+1);
      hx.drawImage(im, 0,ih-BLEED,iw,BLEED, dx, dy+dh-1, dw, dy+1);
      shade(dx, 0, dw, dy, 'v');
    }

  }

  /* light does not travel forever: ease the borrowed edge down as it leaves the frame */
  function shade(x, y, w, h, axis){
    var g, o = 0.62;
    if(axis === 'h'){
      g = hx.createLinearGradient(0,0,w,0);
      g.addColorStop(0,'rgba(0,0,0,'+o+')'); g.addColorStop(1,'rgba(0,0,0,0)');
      hx.fillStyle = g; hx.fillRect(0, y, w, h);
      g = hx.createLinearGradient(HW-w,0,HW,0);
      g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,'+o+')');
      hx.fillStyle = g; hx.fillRect(HW-w, y, w, h);
    } else {
      g = hx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,'rgba(0,0,0,'+o+')'); g.addColorStop(1,'rgba(0,0,0,0)');
      hx.fillStyle = g; hx.fillRect(x, 0, w, h);
      g = hx.createLinearGradient(0,HH-h,0,HH);
      g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,'+o+')');
      hx.fillStyle = g; hx.fillRect(x, HH-h, w, h);
    }
  }

  function seq(){                        /* holds which frame is showing, repaints only on change */
    return function(n){
      n = Math.max(0, Math.min(N-1, n));
      if(n === curFrame) return;
      var im = warm(n);
      if(im.complete && im.naturalWidth){ curFrame = n; paint(im); }
      else im.onload = function(){ curFrame = n; paint(im); };
    };
  }
  /* the opening act keeps its own numbering: frames 58-71 in o/ and om/ */
  var ON = 72, OSEALED = 57;
  var OSET = innerWidth > 760 ? 'o' : 'om';
  var OPEN = Array.from({length:ON}, function(_,i){ return OSET + '/' + pad(i) + '.webp'; });
  var ocache = [];
  function warmO(i){ if(ocache[i]) return; var im = new Image(); im.decoding='async'; im.src = OPEN[i]; ocache[i]=im; }
  (window.requestIdleCallback || function(cb){ setTimeout(cb,900); })(function(){ for(var i=OSEALED+1;i<ON;i++) warmO(i); });
  function seqO(el){
    var cur = -1;
    return function(n){
      n = Math.max(OSEALED+1, Math.min(ON-1, n));
      if(n === cur) return;
      cur = n; warmO(n);
      var im = ocache[n];
      if(im.complete && im.naturalWidth) el.src = OPEN[n];
      else im.onload = function(){ if(cur === n) el.src = OPEN[n]; };
    };
  }
  var putHero = seq();
  var putOpen = shot2 ? seqO(shot2) : null;

  var idc = document.getElementById('id'),
      halo2 = document.getElementById('halo2'),
      nova = document.getElementById('nova'), queued = false;
  var opening = document.getElementById('opening');
  var live = true;

  function onScroll(){
    queued = false;
    var r = arrival.getBoundingClientRect(), span = r.height - innerHeight;
    live = r.bottom > 0 && r.top < innerHeight;
    var p = clamp(-r.top/(span||1), 0, 1);
    /* it arrives at the last frame and stays there — the scroll runs both ways */
    putHero(Math.round(p*(N-1)));

    /* the mark stands in the dark, then gives the frame over to the object */
    idc.classList.toggle('on', p > 0.20 && p < 0.70);

    /* ---- the opening: what the page has been withholding ---- */
    if(opening && putOpen){
      var o = opening.getBoundingClientRect(), ospan = o.height - innerHeight;
      var q = clamp(-o.top/(ospan||1), 0, 1);
      putOpen(OSEALED + 1 + Math.round(q*(ON-1-OSEALED-1)));
      /* the chamber lights before the dome moves */
      var pre = q < 0.42 ? q/0.42 : 1;
      halo2.style.setProperty('--ho', (pre*0.72).toFixed(3));
      halo2.style.setProperty('--hs', (0.66 + pre*0.34).toFixed(3));
      var b = q < 0.56 ? 0 : (q-0.56)/0.44;
      var ease = b*b*(3-2*b);
      var flare = Math.sin(Math.PI*Math.min(ease*1.02,1));
      nova.style.setProperty('--no', (Math.max(flare, ease*0.42)*0.82).toFixed(3));
      nova.style.setProperty('--ns', (0.24 + ease*1.30).toFixed(3));
    }
  }
  function tick(){ if(!queued){ queued = true; requestAnimationFrame(onScroll); } }

  /* ---- boot: black, then the first frame comes up out of it ---- */
  fitHero();
  addEventListener('resize', function(){ fitHero(); tick(); }, {passive:true});

  function ignite(){
    var first = warm(reduce ? N-1 : 0);
    function go(){ curFrame = -1; paint(first); hero.classList.add('lit'); if(!reduce) onScroll(); }
    if(first.complete && first.naturalWidth) go();
    else first.addEventListener('load', go, {once:true});
  }
  ignite();

  if(!reduce){ addEventListener('scroll', tick, {passive:true}); }
  else { if(shot2) shot2.src = (innerWidth>760?'o':'om') + '/71.webp'; idc.classList.add('on'); }

  /* ---- hero sky: a field, and one star that falls ---- */
  (function(){
    var cv = document.getElementById('sky'); if(!cv || reduce) return;
    var g = cv.getContext('2d'), W=0,H=0,D=1,stars=[],run=false,last=0,t=0,meteor=null,next=6000;
    function rnd(a,b){ return a+Math.random()*(b-a); }
    function build(){
      D = Math.min(devicePixelRatio||1,2); W = cv.clientWidth; H = cv.clientHeight;
      cv.width = Math.round(W*D); cv.height = Math.round(H*D); g.setTransform(D,0,0,D,0,0);
      stars = Array.from({length: W<700?60:112}, function(){
        var dep = Math.random();
        return {x:Math.random()*W, y:Math.random()*H, r:.3+dep*1.1, a:.08+dep*.4, tw:rnd(.1,.32), ph:rnd(0,6.28), dep:.15+dep*.85};
      });
    }
    function fall(){
      var L = Math.random()<.55, y0 = rnd(H*.06,H*.4);
      meteor = {x:L?-W*.12:W*1.12, y:y0, vx:(L?1:-1)*rnd(W*.16,W*.26), vy:rnd(H*.05,H*.1), life:0, span:rnd(1.5,2.1)};
    }
    function frame(now){
      if(!run) return;
      var dt = last ? Math.min(.05,(now-last)/1000) : .016; last = now; t += dt;
      g.clearRect(0,0,W,H);
      for(var i=0;i<stars.length;i++){
        var s = stars[i], x = s.x + Math.sin(t*.08+s.ph)*2.2*s.dep, y = s.y - t*.7*s.dep;
        if(y < -6){ s.y += H+12; y += H+12; }
        g.globalAlpha = s.a*(.66+.34*Math.sin(t*s.tw*2+s.ph));
        g.fillStyle = '#EFE9DE'; g.beginPath(); g.arc(x,y,s.r,0,6.283); g.fill();
      }
      next -= dt*1000;
      if(!meteor && next<=0){ fall(); next = rnd(16000,30000); }
      if(meteor){
        meteor.life += dt; var k = meteor.life/meteor.span;
        meteor.x += meteor.vx*dt; meteor.y += meteor.vy*dt;
        var tail = 150+90*Math.sin(Math.PI*Math.min(k,1));
        var ux=-meteor.vx, uy=-meteor.vy, m=Math.hypot(ux,uy)||1; ux=ux/m*tail; uy=uy/m*tail;
        var peak = Math.sin(Math.PI*clamp(k,0,1));
        var grad = g.createLinearGradient(meteor.x,meteor.y,meteor.x+ux,meteor.y+uy);
        grad.addColorStop(0,'rgba(244,238,228,'+(.5*peak).toFixed(3)+')');
        grad.addColorStop(1,'rgba(244,238,228,0)');
        g.globalAlpha=1; g.strokeStyle=grad; g.lineWidth=1.05; g.lineCap='round';
        g.beginPath(); g.moveTo(meteor.x,meteor.y); g.lineTo(meteor.x+ux,meteor.y+uy); g.stroke();
        g.globalAlpha=.6*peak; g.fillStyle='#F6F0E6';
        g.beginPath(); g.arc(meteor.x,meteor.y,1.1,0,6.283); g.fill();
        if(k>1) meteor=null;
      }
      g.globalAlpha=1; requestAnimationFrame(frame);
    }
    build(); addEventListener('resize', build, {passive:true});
    new IntersectionObserver(function(es){
      if(es[0].isIntersecting && !run){ run=true; last=0; requestAnimationFrame(frame); }
      if(!es[0].isIntersecting) run=false;
    }).observe(arrival);
  })();

  /* ---- two states: one line, dragged ---- */
  (function(){
    var sec = document.getElementById('states'); if(!sec) return;
    var grip = document.getElementById('grip'), day = document.getElementById('objDay');
    /* The line never jumps. Input sets a target; the line glides to it on a
       critically damped ease, so a drag, a key press and the idle drift all
       move with the same soft weight. Geometry is measured once (and on
       resize), not on every frame, so nothing forces layout while it moves. */
    var x = 50, target = 50, dragging = false, geo = null, gliding = false, gPrev = 0;
    var vis = false;
    function measureCut(){
      var r = sec.getBoundingClientRect(), ob = document.querySelector('.states .obj').getBoundingClientRect();
      geo = { l: r.left, w: r.width || 1, ol: ob.left, ow: ob.width || 1 };
    }
    function apply(v){
      x = v;
      sec.style.setProperty('--x', x.toFixed(3) + '%');
      var local = clamp(((geo.l + geo.w*x/100) - geo.ol) / geo.ow * 100, 0, 100);
      day.style.setProperty('--ox', local.toFixed(3) + '%');
      grip.setAttribute('aria-valuenow', Math.round(x));
      window.__cut = x;
    }
    function glide(ts){
      var dt = gPrev ? Math.min((ts - gPrev)/1000, 0.05) : 0.016; gPrev = ts;
      var k = 1 - Math.exp(-dt * (dragging ? 9 : 5));      /* follows a hand closely, settles softly */
      var nx = x + (target - x) * k;
      if(Math.abs(target - nx) < 0.004){ apply(target); gliding = false; gPrev = 0; return; }
      apply(nx);
      requestAnimationFrame(glide);
    }
    function put(v){
      target = clamp(v,4,96);
      if(reduce){ apply(target); return; }
      if(!gliding){ gliding = true; requestAnimationFrame(glide); }
    }
    function fromEvent(e){
      var cx = (e.touches ? e.touches[0].clientX : e.clientX);
      put((cx - geo.l)/geo.w*100);
    }
    sec.addEventListener('pointerdown', function(e){ measureCut(); dragging = true; sec.setPointerCapture(e.pointerId); fromEvent(e); });
    sec.addEventListener('pointermove', function(e){ if(dragging) fromEvent(e); });
    sec.addEventListener('pointerup', function(){ dragging = false; });
    sec.addEventListener('pointercancel', function(){ dragging = false; });
    grip.addEventListener('keydown', function(e){
      if(e.key === 'ArrowLeft'){ put(target-3); e.preventDefault(); }
      if(e.key === 'ArrowRight'){ put(target+3); e.preventDefault(); }
    });
    addEventListener('resize', function(){ measureCut(); apply(x); }, {passive:true});
    addEventListener('load', function(){ measureCut(); apply(x); });
    [].forEach.call(sec.querySelectorAll('.obj img'), function(im){ im.addEventListener('load', function(){ measureCut(); apply(x); }); });
    measureCut(); apply(50);

    /* The control teaches itself. Before anyone touches it the line breathes,
       slowly — two long sines (about 26 s and 60 s) eased in over the first
       few seconds — and the object changes with it, so what the handle does is
       demonstrated rather than captioned. It stops the moment the visitor
       takes over, and does not come back: an invitation, not an idle animation. */
    var taught = false, s = 0, iPrev = 0;
    function learned(){ taught = true; }
    sec.addEventListener('pointerdown', learned, {once:true});
    grip.addEventListener('keydown', learned, {once:true});
    new IntersectionObserver(function(es){ vis = es[0].isIntersecting; if(vis){ measureCut(); } iPrev = 0; }).observe(sec);
    function invite(ts){
      if(taught) return;
      if(vis){
        var dt = iPrev ? Math.min((ts - iPrev)/1000, 0.05) : 0; iPrev = ts;
        s += dt;                                            /* time only runs while it is seen */
        var amp = Math.min(1, s/5); amp = amp*amp*(3-2*amp);
        target = 50 + amp*(3.4*Math.sin(s*0.24) + 1.2*Math.sin(s*0.105 + 1.3));
        apply(target);
      } else { iPrev = 0; }
      requestAnimationFrame(invite);
    }
    if(!reduce) requestAnimationFrame(invite);

    /* the night field — slow, and only occasionally does one catch the light */
    var cv = document.getElementById('starfield'); if(cv && !reduce){
      var g = cv.getContext('2d'), W,H,D, pts=[], shoot=null, nextShot=9000;
      function rnd(a,b){ return a+Math.random()*(b-a); }
      function build(){
        D = Math.min(devicePixelRatio||1,2); W = sec.clientWidth; H = sec.clientHeight + 340;
        cv.width = Math.round(W*D); cv.height = Math.round(H*D); g.setTransform(D,0,0,D,0,0);
        pts = Array.from({length: W<700?110:210}, function(){
          var dep = Math.random();                       /* depth: far stars are small and dim */
          return {x:Math.random()*W, y:Math.random()*H*0.94,
                  r:.20+dep*1.05, a:.10+dep*.44,
                  sp:rnd(.16,.42), ph:Math.random()*6.283,      /* 15–39s breath */
                  gl:Math.random()<0.10, nx:rnd(9000,26000), on:0};
        });
      }
      function star(p, t, dt){
        var tw = p.a*(.62+.38*Math.sin(t*p.sp+p.ph));
        if(p.gl){
          p.nx -= dt;
          if(p.nx <= 0){ p.on = 1; p.nx = rnd(14000,34000); }
          if(p.on > 0) p.on = Math.max(0, p.on - dt/3400);      /* a 3.4s bloom, not a blink */
        }
        var f = p.on>0 ? Math.sin(p.on*Math.PI) : 0;
        f = f*f;                                                 /* soft in, soft out */
        if(f > 0.02){                                            /* the glisten: a halo, never a cross */
          var R = p.r*9;
          var gr = g.createRadialGradient(p.x,p.y,0,p.x,p.y,R);
          gr.addColorStop(0,'rgba(255,253,246,'+(0.42*f).toFixed(3)+')');
          gr.addColorStop(.45,'rgba(226,236,255,'+(0.12*f).toFixed(3)+')');
          gr.addColorStop(1,'rgba(226,236,255,0)');
          g.globalAlpha = 1; g.fillStyle = gr;
          g.beginPath(); g.arc(p.x,p.y,R,0,6.283); g.fill();
        }
        g.globalAlpha = Math.min(1, tw + f*.45);
        g.fillStyle = '#EDF2FB';
        g.beginPath(); g.arc(p.x, p.y, p.r*(1+f*.35), 0, 6.283); g.fill();
      }
      var running = false, prev = 0;
      function draw(now){
        if(!running) return;
        var t = now/1000, dt = prev ? Math.min(now-prev, 60) : 16; prev = now;
        g.clearRect(0,0,W,H);
        for(var i=0;i<pts.length;i++) star(pts[i], t, dt);

        nextShot -= dt;
        if(!shoot && nextShot <= 0){
          shoot = {x:rnd(W*0.30,W*0.92), y:rnd(H*0.04,H*0.30), vx:-rnd(0.16,0.26), vy:rnd(0.05,0.09), life:0, len:rnd(130,240)};
          nextShot = rnd(22000,46000);
        }
        if(shoot){
          shoot.life += dt; shoot.x += shoot.vx*dt; shoot.y += shoot.vy*dt;
          var k = shoot.life/2600, fade = k<.22 ? k/.22 : 1-(k-.22)/.78;
          if(k >= 1 || shoot.x < -260) shoot = null;
          else {
            var gx = g.createLinearGradient(shoot.x, shoot.y, shoot.x+shoot.len, shoot.y-shoot.len*0.34);
            gx.addColorStop(0,'rgba(255,255,255,'+(0.72*fade).toFixed(3)+')');
            gx.addColorStop(1,'rgba(255,255,255,0)');
            g.globalAlpha = 1; g.strokeStyle = gx; g.lineWidth = 1.2; g.lineCap='round';
            g.beginPath(); g.moveTo(shoot.x, shoot.y);
            g.lineTo(shoot.x+shoot.len, shoot.y-shoot.len*0.34); g.stroke();
            g.globalAlpha = fade*.8; g.fillStyle='#fff';
            g.beginPath(); g.arc(shoot.x, shoot.y, 1.3, 0, 6.283); g.fill();
          }
        }
        g.globalAlpha=1; requestAnimationFrame(draw);
      }
      build(); addEventListener('resize', build, {passive:true});
      new IntersectionObserver(function(es){
        if(es[0].isIntersecting && !running){ running = true; prev = 0; requestAnimationFrame(draw); }
        if(!es[0].isIntersecting){ running = false; prev = 0; }
      }).observe(sec);
    }

    /* ---- the sky above the object: a peacock, then weather ---- */
    var fk = document.getElementById('flock');
    var clouds = [].slice.call(sec.querySelectorAll('.cloud'));

    if(!reduce){
      var f = fk ? fk.getContext('2d') : null;
      var FW=0, FH=0, FD=1, CEIL=0, FLOOR=0;          /* the sky band birds may use */
      /* One peacock, not a flock. A rig, not a flipbook: one fixed master
         silhouette (head, crest, neck, body, feet, train) that never changes
         shape, jointed wings posed in 3D (shoulder, elbow, wrist, primaries),
         and a train that trails the body's lift and carries a slow wave from
         rump to tips. It is drawn live for the exact moment, so the motion is
         continuous at any refresh rate and the loop has no seam. It is painted
         opaque into its own layer, then laid into each sky with that sky's
         tint: pale against the night, ink-dark against the day. */
      var rig = null, ready = false, BEAT_HZ = 0.42;            /* a large bird: slow, deliberate strokes (~2.4 s each) */
      var CW = 4040, CH = 2230, AX = 840, AY = 1242;          /* reach box and body point, rig px (replaced once the rig loads) */
      var off = document.createElement('canvas'), og = off.getContext('2d');
      var birds = [], drift = null, wait = 4000;
      function r2(a,b){ return a+Math.random()*(b-a); }
      if(fk){
        var rs = document.createElement('script');
        rs.src = 'js/peacock-rig.js';
        rs.onload = function(){
          fetch('img/peacock-master.json').then(function(r){ return r.json(); }).then(function(d){
            rig = new PeacockRig(d, { beatHz: BEAT_HZ });
            CW = rig.box[2]-rig.box[0]; CH = rig.box[3]-rig.box[1];
            AX = rig.anchor[0]-rig.box[0]; AY = rig.anchor[1]-rig.box[1];
            ready = true;
          }).catch(function(){});
        };
        document.head.appendChild(rs);
      }

      /* the object owns the middle of the frame; the bird gets the sky above it */
      function measure(){
        FD = Math.min(devicePixelRatio||1,2); FW = sec.clientWidth;
        var SH = sec.clientHeight; FH = SH + 340;             /* the canvas overhangs the section */
        if(fk){ fk.width = Math.round(FW*FD); fk.height = Math.round(FH*FD); f.setTransform(FD,0,0,FD,0,0);
                fk.style.width = FW + 'px'; fk.style.height = FH + 'px'; }   /* pin CSS size, or retina shows it at 2x */
        var o = sec.querySelector('.states .obj'), sr = sec.getBoundingClientRect();
        var top = (o ? (o.getBoundingClientRect().top - sr.top) : SH*0.4) + 170;   /* into canvas space */
        CEIL  = Math.max(SH*0.075, 70) + 170;                 /* under the masthead, over the object */
        FLOOR = Math.max(CEIL + SH*0.10, top - Math.max(46, SH*0.07));
        clouds.forEach(function(el){ el._w = el.offsetWidth; el._h = el.offsetHeight; });
      }

      /* ---------- the peacock ---------- */
      function launch(){
        measure();                                            /* the object may have loaded since */
        var band = FLOOR - CEIL;
        var w = Math.max(190, Math.min(FW*0.26, 440));       /* css px, beak to the tip of the train */
        var s = w / CW;
        drift = {
          y: CEIL + band*r2(0.40,0.80),
          vx: -(FW + w*1.3) / r2(22,27),                       /* about ten unhurried strokes across */
          f1: r2(.045,.07), f2: r2(.09,.13),                  /* never commensurate */
          p1: Math.random()*6.283, p2: Math.random()*6.283,
          a1: r2(6,12), a2: r2(2,4)                             /* a slow drift of the path, never a bounce */
        };
        birds = [{
          s: s, h: CH*s,
          x: FW + AX*s + 24,
          t: 0,                                              /* its own clock: the rig poses it for any moment */
          pitch: 0, yPrev: null, vy: 0, y: 0, out: false
        }];
      }
      function driftY(t){
        return drift.y
             + drift.a1*Math.sin(t*drift.f1*6.283 + drift.p1)
             + drift.a2*Math.sin(t*drift.f2*6.283 + drift.p2);
      }
      function stepBirds(t, dt){
        var b = birds[0]; if(!b) return;
        b.t += dt;
        /* each downstroke drives it forward; on the recovery it coasts on momentum.
           Peak speed lands just after the power stroke, with the body's lift. */
        var bp = (b.t*BEAT_HZ) % 1;
        b.x += drift.vx * (1 + 0.14*Math.sin(6.283*(bp - 0.12))) * dt;

        var y = driftY(t) - par*58;
        y = Math.max(CEIL + b.h*0.62, Math.min(y, FLOOR + b.h*0.12));   /* raised wingtips stay clear of the masthead */
        b.vy = b.yPrev === null ? 0 : (y - b.yPrev)/Math.max(dt,0.001);
        b.yPrev = y; b.y = y;
        /* nose follows the path, gently */
        var want = -Math.max(-0.07, Math.min(0.07, Math.atan(b.vy/Math.abs(drift.vx))));
        b.pitch += (want - b.pitch) * Math.min(1, dt*2);
        b.out = (b.x + (CW - AX)*b.s) < -24;
      }
      function paintBirds(col, alpha){
        var b = birds[0]; if(!b || !ready) return;
        if(b.x - AX*b.s > FW + 40 || b.out) return;
        /* the bird is drawn opaque into its own layer first, so overlapping
           feathers never double up when the layer is laid in with alpha */
        var sc = b.s*FD, bw = Math.ceil(CW*sc), bh = Math.ceil(CH*sc);
        if(off.width !== bw || off.height !== bh){ off.width = bw; off.height = bh; }
        og.setTransform(1,0,0,1,0,0); og.clearRect(0,0,bw,bh);
        og.setTransform(sc,0,0,sc,-rig.box[0]*sc,-rig.box[1]*sc);
        rig.draw(og, b.t, col);
        f.save();
        f.translate(b.x, b.y);
        f.rotate(b.pitch);
        f.globalAlpha = alpha;
        f.drawImage(off, -AX*b.s, -AY*b.s, CW*b.s, CH*b.s);
        f.restore();
        f.globalAlpha = 1;
      }

      /* ---------- the weather ---------- */
      clouds.forEach(function(el){
        var d = parseFloat(el.dataset.d) || 0.5;       /* 0 far, 1 near */
        el._d = d;
        el._v = -(0.10 + 0.95*d);                      /* px per second — a sky, not a slideshow */
        el._x = Math.random();
        el._y = r2(-1,1);
        el._sf = r2(.004,.011); el._sp = Math.random()*6.283;
        el._of = r2(.006,.015); el._op = Math.random()*6.283;
        el._bf = r2(.003,.008); el._bp = Math.random()*6.283;
        el._base = parseFloat(getComputedStyle(el).opacity) || 1;
      });
      function stepClouds(t){
        for(var i=0;i<clouds.length;i++){
          var el = clouds[i], w = el._w || 300;
          var span = FW + w*2.4;
          var x = ((el._x*span + el._v*t) % span + span) % span - w*1.2;
          var y = el._y*10 + Math.sin(t*el._bf*6.283 + el._bp)*9*(0.4+el._d);
          var sc = 1 + 0.07*Math.sin(t*el._sf*6.283 + el._sp);
          el.style.transform = 'translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0) scale('+sc.toFixed(3)+','+(1+0.04*Math.sin(t*el._sf*4.1+el._sp)).toFixed(3)+')';
          el.style.opacity = (el._base*(0.80 + 0.20*Math.sin(t*el._of*6.283 + el._op))).toFixed(3);
        }
      }

      /* ---- parallax: the far sky lags, the near weather keeps up ---- */
      var PAD = 170;
      var skyN = sec.querySelector('.sky-night'), skyD = sec.querySelector('.sky-day'),
          wN = sec.querySelectorAll('.weather')[0], wD = sec.querySelectorAll('.weather')[1],
          orbs = sec.querySelectorAll('.orb'), starC = sec.querySelector('.stars');
      var par = 0;
      function depth(){
        var r = sec.getBoundingClientRect();
        /* -1 when the section sits above the viewport, +1 when below */
        var t = (r.top + r.height/2 - innerHeight/2) / innerHeight;
        par = Math.max(-1.4, Math.min(1.4, t));
        var sky = (-par*118).toFixed(1), wea = (-par*34).toFixed(1), orb = (-par*112).toFixed(1);
        if(skyN) skyN.style.transform = 'translate3d(0,'+sky+'px,0)';
        if(skyD) skyD.style.transform = 'translate3d(0,'+sky+'px,0)';
        if(starC) starC.style.transform = 'translate3d(0,'+sky+'px,0)';
        if(wN) wN.style.transform = 'translate3d(0,'+wea+'px,0)';
        if(wD) wD.style.transform = 'translate3d(0,'+wea+'px,0)';
        for(var i=0;i<orbs.length;i++) orbs[i].style.transform = 'translate3d(0,'+orb+'px,0)';
        /* the birds parallax inside the canvas, so the keep-out still holds */
      }
      var pq = false;
      function onPar(){ if(!pq){ pq = true; requestAnimationFrame(function(){ pq = false; depth(); }); } }
      addEventListener('scroll', onPar, {passive:true});
      addEventListener('resize', onPar, {passive:true});
      depth();

      var on = false, last = 0;
      function frame(now){
        if(!on) return;
        var t = now/1000, dt = last ? Math.min((now-last)/1000, 0.064) : 0.016; last = now;
        stepClouds(t);
        if(f && ready){
          f.clearRect(0,0,FW,FH);
          if(drift){
            stepBirds(t, dt);
            var gone = true;
            if(birds[0] && !birds[0].out) gone = false;
            var cutX = FW * (window.__cut || 50)/100;
            f.save(); f.beginPath(); f.rect(0,0,cutX,FH); f.clip();
            paintBirds('#DEE8F8', .84); f.restore();
            f.save(); f.beginPath(); f.rect(cutX,0,FW-cutX,FH); f.clip();
            paintBirds('#0C1119', .96); f.restore();
            if(gone){ drift = null; birds = []; wait = r2(14,30)*1000; }
          } else {
            wait -= dt*1000;
            if(wait <= 0) launch();
          }
        }
        requestAnimationFrame(frame);
      }
      measure(); addEventListener('resize', measure, {passive:true});
      new IntersectionObserver(function(es){
        if(es[0].isIntersecting && !on){ on = true; last = 0; requestAnimationFrame(frame); }
        if(!es[0].isIntersecting){ on = false; last = 0; }
      }).observe(sec);
    }
  })();

  /* ---- adrift: the core, weightless ---- */
  (function(){
    var sec = document.getElementById('drift'); if(!sec || reduce) return;
    var els = [].slice.call(sec.querySelectorAll('.sp'));
    /* No turning. Each one wanders on three slow sines per axis whose periods
       share no common multiple, so the path never closes and never repeats —
       it is not a loop hidden behind a long duration, there is no loop. The
       periods run 70 to 250 seconds: below the speed at which the eye starts
       tracking a thing, which is what makes it read as drifting rather than
       animating. Phases are seeded at random, so no two visits are alike.
       Scale breathes a couple of per cent — with nothing rotating, that slight
       swell is what says the object is moving through space and not across a
       surface. */
    /* a narrow window has no room to wander in: the same swing that reads as
       drift at 1920 walks the nearest specimen off the right edge at 390 */
    var AMP = innerWidth < 620 ? 0.55 : 1;
    var P = els.map(function(el, i){
      var d = [0.55, 1.0, 0.36, 0.72][i];        /* depth: how near it drifts */
      return {
        el: el, d: d,
        ax: (30 + 40*d)*AMP, ay: (24 + 32*d)*AMP, /* the near ones wander furthest */
        f1: [0.0121,0.0093,0.0147,0.0106][i],    /* periods that never come back into step */
        f2: [0.0072,0.0134,0.0088,0.0117][i],
        f3: [0.0045,0.0051,0.0039,0.0058][i],
        p1: Math.random()*6.283, p2: Math.random()*6.283, p3: Math.random()*6.283,
        sf: [0.0038,0.0029,0.0047,0.0034][i], sp: Math.random()*6.283
      };
    });

    var par = 0, on = false;
    function depth(){
      var r = sec.getBoundingClientRect();
      par = Math.max(-1.3, Math.min(1.3, (r.top + r.height/2 - innerHeight/2)/innerHeight));
    }
    function frame(now){
      if(!on) return;
      var t = now/1000;
      depth();
      for(var i=0;i<P.length;i++){
        var o = P[i];
        var x = o.ax*Math.sin(t*o.f1*6.283 + o.p1)
              + o.ax*0.44*Math.sin(t*o.f2*6.283 + o.p2)
              + o.ax*0.18*Math.sin(t*o.f3*6.283 + o.p3);
        var y = o.ay*Math.cos(t*o.f2*6.283 + o.p2)
              + o.ay*0.52*Math.sin(t*o.f3*6.283 + o.p3)
              + o.ay*0.20*Math.cos(t*o.f1*6.283 + o.p1)
              - par*(150*o.d);                    /* the near ones travel most */
        var sc = 1 + 0.025*Math.sin(t*o.sf*6.283 + o.sp);
        o.el.style.transform = 'translate(-50%,-50%) translate3d('
                             + x.toFixed(2)+'px,'+y.toFixed(2)+'px,0) scale('+ sc.toFixed(4) +')';
      }
      requestAnimationFrame(frame);
    }
    new IntersectionObserver(function(es){
      if(es[0].isIntersecting && !on){ on = true; requestAnimationFrame(frame); }
      if(!es[0].isIntersecting) on = false;
    }, {rootMargin:'40% 0px'}).observe(sec);
  })();

  /* ---- masthead over light fields ---- */
  (function(){
    var mast = document.getElementById('mast');
    var lights = document.querySelectorAll('.states');
    function test(){
      var mr = mast.getBoundingClientRect(), y = mr.bottom - 6, on = false;
      var lx = mast.querySelector('.lock').getBoundingClientRect();
      var mid = (lx.left + lx.right)/2;
      lights.forEach(function(el){
        var r = el.getBoundingClientRect();
        if(r.top <= y && r.bottom >= y){
          var cutX = r.left + r.width * (parseFloat(getComputedStyle(el).getPropertyValue('--x')) || 50)/100;
          if(mid > cutX) on = true;          /* only the daylight half needs the dark mark */
        }
      });
      mast.classList.toggle('on-light', on);
    }
    mast._test = test;
    addEventListener('scroll', test, {passive:true}); addEventListener('resize', test, {passive:true}); test();
  })();

  /* ---- arrivals ---- */
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:.2, rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.rise,.fade').forEach(function(el){ io.observe(el); });

  /* ---- the address ---- */
  var form = document.getElementById('join');
  if(form){
    var email = document.getElementById('email'), note = document.getElementById('note');
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var v = email.value.trim(), ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
      note.textContent = ok ? 'Noted.' : 'Incomplete.';
      if(ok) email.value = '';
    });
  }
})();
</script>
</body>
</html>
